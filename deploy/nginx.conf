# nginx: copiar a /etc/nginx/sites-available/agenda, enlazar en sites-enabled,
# reemplazar agenda.ejemplo.com y obtener HTTPS con: sudo certbot --nginx -d agenda.ejemplo.com
server {
    listen 80;
    server_name agenda.ejemplo.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
    }
}
